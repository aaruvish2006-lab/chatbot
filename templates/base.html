<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}AI Chatbot{% endblock %}</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:linear-gradient(135deg,#0F172A,#1E3A8A,#0F172A);
}

/* Navbar */

.navbar{

    width:100%;
    height:70px;
    background:rgba(15,23,42,.95);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
    position:fixed;
    top:0;
    left:0;
    z-index:1000;
}

.logo{

    color:white;
    font-size:28px;
    font-weight:bold;

}

.menu a{

    color:white;
    text-decoration:none;
    margin-left:30px;

}

.menu a:hover{

    color:#60A5FA;

}

.page{

    padding-top:90px;

}

</style>

{% block css %}

{% endblock %}

</head>

<body>

<header class="navbar">

<div class="logo">
🤖 AI AARU Chatbot
</div>

<div class="menu">

<a href="/chatbot">Home</a>
<a href="/features">Features</a>
<a href="/about">About</a>
<a href="/contact">Contact</a>
<a href="/users">Users</a>
<a href="/logout">Logout</a>

</div>

</header>

<div class="page">

{% block content %}

{% endblock %}

</div>

{% block script %}

{% endblock %}

</body>
</html>
