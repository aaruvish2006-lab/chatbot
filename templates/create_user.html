<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create User</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0F172A,#1E3A8A,#0F172A);
}

.container{
    width:450px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

h2{
    text-align:center;
    margin-bottom:20px;
    color:#2563EB;
}

label{
    display:block;
    margin-top:15px;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    background:#2563EB;
    color:white;
    border:none;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1D4ED8;
}

</style>

</head>

<body>

<div class="container">

<h2>Create User</h2>

<form method="POST">

<label>Name</label>
<input type="text" name="name" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Contact</label>
<input type="text" name="contact" required>

<label>City</label>
<input type="text" name="city" required>

<button type="submit">Create User</button>

</form>

</div>

</body>
</html>
