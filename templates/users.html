<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:linear-gradient(135deg,#0F172A,#1E3A8A,#0F172A);
}

/* Navbar */

.navbar{
    width:100%;
    height:70px;
    background:rgba(15,23,42,.95);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 60px;
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}

.menu a{
    color:white;
    text-decoration:none;
    margin-left:30px;
}

.menu a:hover{
    color:#60A5FA;
}

/* Table */

.container{
    width:90%;
    margin:80px auto;
}

h2{
    color:white;
    text-align:center;
    margin-bottom:30px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

th{
    background:#2563EB;
    color:white;
    padding:15px;
}

td{
    padding:12px;
    text-align:center;
}

tr:nth-child(even){
    background:#f2f2f2;
}

button{
    background:#2563EB;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1D4ED8;
}

</style>

</head>

<body>

<header class="navbar">

<div class="logo">
🤖 AI Chatbot
</div>

<div class="menu">
    <a href="/chatbot">Home</a>
    <a href="/features">Features</a>
    <a href="/about">About</a>
    <a href="/contact">Contact</a>
    <a href="/users">Users</a>
</div>

</header>

<div class="container">

<h2>Registered Users</h2>
<div style="margin-bottom:20px;">
    <a href="/create-user">
        <button>Add New User</button>
    </a>
</div>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Contact</th>
    <th>City</th>
    <th>Action</th>
</tr>

{% for user in users %}

<tr>
    <td>{{ user[0] }}</td>
    <td>{{ user[1] }}</td>
    <td>{{ user[2] }}</td>
    <td>{{ user[3] }}</td>
    <td>{{ user[4] }}</td>
<td>

    <a href="/user/{{ user[0] }}">
        <button>Show</button>
    </a>

    <a href="/edit_user/{{ user[0] }}">
        <button>Edit</button>
    </a>

    <a href="/delete_user/{{ user[0] }}"
       onclick="return confirm('Are you sure you want to delete this user?')">
        <button>Delete</button>
    </a>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
